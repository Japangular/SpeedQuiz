<mat-card>
  <mat-radio-group [value]="dict.selectedOption()" (change)="dict.selectedOption.set($any($event.value))" [disabled]="loading()">
    <mat-radio-button [value]="searchModes.Kanji">Search Kanji</mat-radio-button>
    <mat-radio-button [value]="searchModes.Tokenize">Tokenize Text</mat-radio-button>
    <mat-radio-button [value]="searchModes.VocabCards">Generate Vocab Cards from Text</mat-radio-button>
    <mat-radio-button [value]="searchModes.JoujouKanjis">Show Jouyou Kanjis</mat-radio-button>
    <mat-radio-button [value]="searchModes.Combined">Combined Rows</mat-radio-button>
  </mat-radio-group>

  <mat-form-field class="full-width" appearance="fill">
    <mat-label>Search Japanese word</mat-label>
    <input matInput [value]="searchTerm()" (input)="searchTerm.set($any($event.target).value)" (keyup.enter)="triggerSearch()" [disabled]="loading() || isJoujou()"/>
    <button mat-icon-button matSuffix (click)="triggerSearch()">
      <mat-icon>search</mat-icon>
    </button>
  </mat-form-field>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  @if (tableResults()) {
    <div>
      @if (tableResults().length > 0) {
        <mat-table [dataSource]="tableResults()">
          <!-- Dynamically create column headers and rows -->
          @for (column of displayedColumns(); track column) {
            <ng-container [matColumnDef]="column">
              <mat-header-cell
                *matHeaderCellDef
                (click)="toggleColumnSelection(column)"
                [class.selected-column]="isColumnSelected(column)">
                {{ column | titlecase }}
              </mat-header-cell>
              <mat-cell *matCellDef="let element">{{ element[column]  }}</mat-cell>
            </ng-container>
          }
          <mat-header-row *matHeaderRowDef="displayedColumns()"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns();"></mat-row>
        </mat-table>
      }
    </div>
  }
</mat-card>
