@if (hasCards()) {
  <mat-card appearance="outlined">
    <mat-card-content>
      @if (popoutSupported) {
        <button mat-icon-button
                (click)="popoutToggle.emit()"
                [matTooltip]="popoutActive ? 'Bring quiz back' : 'Float quiz over other windows'">
          <mat-icon>{{ popoutActive ? 'close_fullscreen' : 'picture_in_picture_alt' }}</mat-icon>
        </button>
      }

      <mat-slide-toggle
        class="youtube-toggle"
        [checked]="showYoutube"
        (change)="showYoutubeChange.emit($event.checked)"
        matTooltip="Show a YouTube player above the quiz">
        <mat-icon>smart_display</mat-icon>
      </mat-slide-toggle>

      <mat-slide-toggle
        class="stroke-order-toggle"
        [checked]="showStrokeOrder"
        (change)="showStrokeOrderChange.emit($event.checked)"
        matTooltip="Show kanji stroke order practice">
        <mat-icon>draw</mat-icon>
      </mat-slide-toggle>

      @if (canReorder) {
        <button mat-icon-button
                (click)="reorderToggle.emit()"
                [matTooltip]="reorderActive ? 'Done reordering' : 'Reorder fields'">
          <mat-icon>{{ reorderActive ? 'check' : 'swap_vert' }}</mat-icon>
        </button>
      }

      <button mat-icon-button
              (click)="hintRequested.emit()"
              (mouseenter)="hintHovered.emit()"
              (focus)="hintHovered.emit()"
              matTooltip="Show hint (Ctrl+H)">
        <mat-icon>lightbulb</mat-icon>
      </button>

      <button mat-icon-button (click)="resetDeck()" matTooltip="Reset progress">
        <mat-icon>restart_alt</mat-icon>
      </button>

      <!-- Hiragana debounce tuner -->
      <button mat-icon-button
              (click)="showDebounceSlider = !showDebounceSlider"
              [matTooltip]="showDebounceSlider ? 'Hide typing delay setting' : 'Adjust hiragana typing delay (currently ' + debounceLabel + ')'"
              [class.active-setting]="showDebounceSlider">
        <mat-icon>timer</mat-icon>
      </button>
    </mat-card-content>

    <!-- Debounce slider — shown inline below the buttons when toggled -->
    @if (showDebounceSlider) {
      <mat-card-content class="debounce-row">
        <span class="debounce-label">
          <mat-icon class="debounce-icon">keyboard</mat-icon>
          Hiragana typing delay
        </span>
        <mat-slider
          [min]="100"
          [max]="1000"
          [step]="50"
          [discrete]="true"
          class="debounce-slider">
          <input
            matSliderThumb
            [value]="settings.hiraganaDebounceMs()"
            (valueChange)="onDebounceChange($event)">
        </mat-slider>
        <span class="debounce-value">{{ debounceLabel }}</span>
        <span class="debounce-hint">
          Increase if fast keys like は (ha) get cut short before you finish typing はち (hachi).
        </span>
    </mat-card-content>
    }
  </mat-card>
} @else {
  <mat-toolbar class="deck-bar empty">
    <mat-icon>inbox</mat-icon>
    <span>No deck loaded</span>
  </mat-toolbar>
}
