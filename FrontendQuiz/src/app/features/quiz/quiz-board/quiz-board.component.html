<div class="quizBoard">
  <app-deck-bar
    [canReorder]="fieldOrder.length > 1 && currentSlots.length > 0"
    [reorderActive]="showReorder"
    (reorderToggle)="toggleReorder()" />

  @if (showReorder && fieldOrder.length > 1) {
    <div class="field-order-list" cdkDropList (cdkDropListDropped)="onReorder($event)">
      @for (key of fieldOrder; track key) {
        <div class="field-order-chip" cdkDrag>
          <mat-icon cdkDragHandle class="drag-handle">drag_indicator</mat-icon>
          <span>{{ key }}</span>
        </div>
      }
    </div>
  }

  @if (currentSlots.length > 0) {
    <app-slot-group
      [slots]="currentSlots"
      (allSolved)="onCardSolved($event)"
      (labelClicked)="onLabelClicked($event)" />
  } @else {
    <div class="empty-quiz-state">
      <mat-icon>school</mat-icon>
      <p>No deck loaded. Pick one from the shelf to start.</p>
      <a mat-raised-button color="primary" routerLink="/deckShelf">Open deck shelf</a>
    </div>
  }
</div>

<ng-template #historyPanel>
  <app-quiz-history-sidebar />
</ng-template>
