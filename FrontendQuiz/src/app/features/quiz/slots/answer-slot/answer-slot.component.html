@switch (effectiveRenderHint) {
  @case ('stroke-order') {
    <app-stroke-order-kanji
      [japanese]="correctAnswer"
      [isWrapContent]="false"
      (emitStrokeOrderComplete)="onStrokeResult($event)">
    </app-stroke-order-kanji>
  }
  @default {
    <mat-form-field appearance="outline">
      <mat-label>Enter {{ fieldName }}</mat-label>
      <input matInput
             #inputRef
             [formControl]="control"
             (input)="typed.emit()"
             [placeholder]="'Enter ' + fieldName"
             [class.wrong-fading]="fading"
             [style.--clear-ms.ms]="clearMs"
             autocapitalize="off"
             autocorrect="off"
             autocomplete="off"
             spellcheck="false" />
    </mat-form-field>
  }
}
