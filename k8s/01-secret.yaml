# Secrets replace your Ansible-vault-rendered .env file.
# This is the K8s equivalent of:
#   POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD from env.j2
#
# kubectl does NOT expand ${VAR} itself, so apply this file through envsubst:
# set -a; source .env; set +a          # or: export POSTGRES_DB=... etc.
# envsubst < k8s/01-secret.yaml | kubectl apply -f -
#
# Everything else stays plain `kubectl apply -f k8s/`; only this one file needs
# the envsubst pipe. (Alternative for later: kustomize secretGenerator with an
# untracked .env, or sealed-secrets / external-secrets once there's a real cluster.)

# IMPORTANT LEARNING POINTS:
#   1. "stringData" lets you write plain text; Kubernetes base64-encodes it
#      into "data" on the server. Base64 is ENCODING, not encryption --
#      anyone with "kubectl get secret -o yaml" rights can read it.
#      changed to : no real values in git, same principle as compose's ${VAR} substitution from .env / Ansible vault.

#   2. For real production you'd use Sealed Secrets, SOPS, or External
#      Secrets Operator so you never commit plaintext. For local learning
#      this file is fine, but add it to .gitignore (like your .env).
#      changed to : no real values in git, same principle as compose's ${VAR} substitution from .env / Ansible vault.

#   3. Later on Hetzner: keep this out of git, create it once imperatively:
#      kubectl -n speedquiz create secret generic speedquiz-secrets \
#        --from-literal=POSTGRES_DB=speedquizdb \
#        --from-literal=POSTGRES_USER=speedquiz \
#        --from-literal=POSTGRES_PASSWORD='real-password'

apiVersion: v1
kind: Secret
metadata:
  name: speedquiz-secrets
  namespace: speedquiz
type: Opaque
stringData:
  POSTGRES_DB: "${POSTGRES_DB}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"