spring.application.name=BackendSpeed

# PostgreSQL (shared settings ? profiles override url)
spring.datasource.postgresql.username=speedquiz
spring.datasource.postgresql.password=${POSTGRES_PASSWORD}
spring.datasource.postgresql.driver-class-name=org.postgresql.Driver

# HikariCP pool settings
spring.datasource.postgresql.hikari.maximum-pool-size=10
spring.datasource.postgresql.hikari.minimum-idle=2
spring.datasource.postgresql.hikari.connection-timeout=30000
spring.datasource.postgresql.hikari.idle-timeout=600000

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Detailed view for the deploy gate ? only reachable inside the docker network,
# since /api/actuator/ (anything but the exact /health path) is blocked at nginx.
management.endpoint.health.group.internal.include=*
management.endpoint.health.group.internal.show-details=always

# Logging
logging.level.org.springframework.dao=info
logging.level.org.springframework.web=info

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

app.cors.allowed-origins=http://localhost:4200,http://localhost:4300
