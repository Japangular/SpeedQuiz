[defaults]
inventory = inventory.yml
roles_path = ./roles
interpreter_python = auto_silent

# Readable task output. Since ansible-core 2.13 this is an option on the
# built-in default callback. The old `stdout_callback = yaml` was a redirect
# to community.general.yaml, which that collection removed in 12.0.0.
stdout_callback = default
callback_result_format = yaml

# Per-task timing and total runtime.
callbacks_enabled = ansible.posix.timer

# Convenience for a personal project: skip the SSH key prompt on first connect.
# In a real shop you'd manage known_hosts properly.
host_key_checking = False

[privilege_escalation]
become = True
become_method = sudo