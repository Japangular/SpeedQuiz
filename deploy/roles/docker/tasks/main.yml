# Docker role: install Docker Engine + Compose v2 from the upstream Docker apt repo.
# Fachfrage hook:
#   - "Warum nicht docker.io aus den Ubuntu-Repos?" -> Schneller patch cycle,
#     aktuelle compose-Plugin-Version (kein altes docker-compose Python-Wrapper).
---
- name: Create keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure docker is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add deploy user to docker group (so no sudo needed for docker compose)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
