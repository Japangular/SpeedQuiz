worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100m;

        # ---- GLOBAL SECURITY HEADERS ----
        add_header Content-Security-Policy "frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Production-only server-level snippets (e.g. auth_basic).
        # In local dev no files exist here, so this include matches nothing.
        include /etc/nginx/site-snippets/*.conf;

        location / {
            root /usr/share/nginx/html/browser;  # Point to the correct folder
            try_files $uri $uri/ /index.html;  # Angular routing fallback
        }

        # Health endpoint is exempted from auth so deploy health checks
        # and external monitoring (e.g. Uptime Kuma) can reach it.
        location = /api/actuator/health {
            auth_basic off;
            proxy_pass http://backend:8080/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy API requests to Spring Boot backend
        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /kanjivg/ {
            root /usr/share/nginx/html;

            # Re-include global security headers to bypass Nginx inheritance rules
            add_header Content-Security-Policy "frame-ancestors 'none';" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            # CORS Headers
            add_header 'Access-Control-Allow-Origin' 'http://localhost:4200' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;

            if ($request_method = 'OPTIONS') {
                # Preflight response headers
                add_header Content-Security-Policy "frame-ancestors 'none';";
                add_header X-Content-Type-Options "nosniff";
                add_header Referrer-Policy "strict-origin-when-cross-origin";
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
                add_header 'Access-Control-Allow-Origin' 'http://localhost:4200';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept';
                return 204;
            }
        }
    }
}
