# SpeedQuiz — container-level nginx.
#
# TLS and mTLS terminate on the HOST nginx (deploy/roles/nginx/templates/
# speedquiz-tls.conf.j2). This instance speaks plain HTTP on the docker
# network and is bound to 127.0.0.1 in production. It is never the ingress.
#
# ─────────────────────────────────────────────────────────────────────────
# THE INHERITANCE RULE (the one everybody gets wrong)
#
#   add_header and proxy_set_header are inherited from the parent block
#   ONLY IF the child block declares NONE of its own. Declaring a single
#   add_header inside a location silently drops every inherited one.
#
#   Note that these are two independent directive arrays: having
#   proxy_set_header in a location does NOT suppress inherited add_header.
#
#   Strategy in this file: every add_header and proxy_set_header is
#   declared once at server level and no location declares any. Anything
#   that must vary per request is computed with `map`. The trap therefore
#   cannot fire, and there is nothing duplicated that can drift apart.
# ─────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset       utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    # ---- COMPRESSION ----
    # The production budget allows a 3MB initial bundle and KanjiVG ships
    # ~11k SVGs. All of it is text and all of it was going out uncompressed.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ─── PER-REQUEST VALUES (map, not `if`) ──────────────────────────────

    # angular.json sets "outputHashing": "all", so every js/css filename is
    # content-addressed and safe to pin forever. index.html never is, or
    # clients would stay welded to a stale bundle hash after each deploy.
    map $uri $cache_control {
        default                            "no-cache";
        "~*\.(?:js|css|woff2?|ttf|eot)$"   "public, max-age=31536000, immutable";
        "~*^/kanjivg/"                     "public, max-age=2592000";
        "~*\.(?:png|jpe?g|gif|ico|webp)$"  "public, max-age=2592000";
    }

    # CORS allowlist. An empty value makes nginx omit the header entirely,
    # so this is inert in production where the app is same-origin.
    # `ng serve` already proxies /kanjivg via proxy.conf.json, which makes
    # this dead config in dev too — kept only as a safe hook in case you
    # ever point the dev server straight at this nginx.
    map $http_origin $cors_origin {
        default                 "";
        "http://localhost:4200" $http_origin;
    }

    # Preserve the scheme the host nginx saw; fall back to ours when hit
    # directly (local docker compose, where no host proxy is in front).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream backend_app {
        server backend:8080;
        keepalive 16;          # needs proxy_http_version 1.1 + empty Connection
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100m;   # Anki .apkg uploads

        # ─── RESPONSE HEADERS — declared once, inherited everywhere ──────
        #
        # If you embed YouTube, append:  frame-src https://www.youtube-nocookie.com;
        # 'unsafe-inline' on style-src is required by Angular Material's
        # runtime style injection; drop it only if you move to CSP nonces.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options    "nosniff"                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control             $cache_control                     always;

        # Emitted only when $cors_origin is non-empty (see map above).
        add_header Access-Control-Allow-Origin  $cors_origin      always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS"    always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
        add_header Vary                         "Origin"          always;

        # ─── UPSTREAM HEADERS — same rule, also declared once ────────────
        proxy_http_version 1.1;
        proxy_set_header Connection        "";      # enables upstream keepalive
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Production-only snippets (auth_basic). A glob matching zero files
        # is legal, so this is a no-op in local dev.
        include /etc/nginx/site-snippets/*.conf;

        # ─── ANGULAR APP ─────────────────────────────────────────────────
        location / {
            root /usr/share/nginx/html/browser;
            try_files $uri $uri/ /index.html;
        }

        # ─── ACTUATOR ────────────────────────────────────────────────────
        # An exact-match location beats every prefix match regardless of
        # order, so health stays reachable for deploy checks and Uptime Kuma
        # even when the auth snippet is active.
        location = /api/actuator/health {
            auth_basic off;
            proxy_pass http://backend_app/actuator/health;
        }

        # Everything else under actuator is internal-only. Prometheus scrapes
        # backend:8080 directly over the docker network, never through here.
        location /api/actuator/ {
            return 404;
        }

        # ─── API ─────────────────────────────────────────────────────────
        # The trailing slash on proxy_pass strips the /api/ prefix, so
        # /api/kanjiDict/search reaches Spring as /kanjiDict/search.
        #
        # THIS IS DELIBERATE. The controllers are mapped at /kanjiDict,
        # /japaneseDict, /deck … with no /api segment. Removing the slash
        # 404s the entire API. Do not "fix" it.
        location /api/ {
            proxy_pass http://backend_app/;
        }

        # ─── KANJIVG STROKE-ORDER SVGS ───────────────────────────────────
        # root (not alias): /kanjivg/0e9ba.svg → /usr/share/nginx/html/kanjivg/0e9ba.svg
        location /kanjivg/ {
            root /usr/share/nginx/html;

            # `return` and `rewrite` are the directives documented as safe
            # inside `if`. No add_header here, so the 204 still inherits the
            # full header set from server level.
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }
}