networks:
  custom_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16  # avoid 192.168.x.x

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: BackendSpeed/Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_POSTGRESQL_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}    # for Flyway
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_DICTIONARY_REQUIRED: ${APP_DICTIONARY_REQUIRED:-false}

      OPENAPI_SPEC_PATH: /app/api.yaml
    depends_on:
      - db
      - python_dict
    ports:
      - "8080:8080"
    volumes:
      - ./api.yaml:/app/api.yaml
      - ./JMdict_e.xml:/app/jmdict_e.xml
      - ./htmlImports:/app/htmlImports:ro
      - anki-tmp:/app/anki-tmp

  frontend:
    build:
      context: .
      dockerfile: FrontendQuiz/Dockerfile.frontend
    ports:
      - "4200:80"
    volumes:
      - ./api.yaml:/app/api.yaml

  nginx:
    build:
      context: .
      dockerfile: FrontendQuiz/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - frontend
    volumes:
      - ./KanjiVG:/usr/share/nginx/html/kanjivg:ro

  python_dict:
    build:
      context: .
      dockerfile: PythonDict/Dockerfile.python_dict
    ports:
      - "8000:8000"
  prometheus:
    image: prom/prometheus:vX.Y.Z      # pin a real tag, never :latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:X.Y.Z   # pin a real tag
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?grafana admin password not set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    depends_on:
      - prometheus

volumes:
  db-data:
  anki-tmp:
  prometheus-data:
  grafana-data:
